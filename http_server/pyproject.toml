[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optisweep-brain-http"
version = "0.1.0"
description = "HTTP API exposing Brain's context/feedback/review routes to the appcode runtime (OPTISWEEP_APP_BRAIN_HTTP_BOUNDARY.md)."
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
]

[project.scripts]
optisweep-brain-http = "http_server.app:main"

[tool.setuptools]
py-modules = []
