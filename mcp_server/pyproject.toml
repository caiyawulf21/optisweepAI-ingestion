[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optisweep-brain-mcp"
version = "0.1.0"
description = "MCP server exposing the OptiSweep Brain ingestion/reconciliation tools to Cursor/Codex-style agents."
requires-python = ">=3.11"
dependencies = [
  "mcp",
  "pydantic",
]

[project.scripts]
optisweep-brain-mcp = "mcp_server.server:main"

[tool.setuptools]
py-modules = []
